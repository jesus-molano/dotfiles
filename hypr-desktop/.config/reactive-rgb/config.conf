# ASUS TUF B550: CPU y ventiladores internos conectados a Aura Addressable 1.
# No controla GPU, RAM ni ventiladores PWM. Las líneas frontal/superior quedan blancas.
# El nombre se valida de forma exacta al iniciar.
REACTIVE_RGB_ENABLED=1
REACTIVE_RGB_MODE=thermal
REACTIVE_RGB_AMBIENT_COLOR=FF5B4D
REACTIVE_RGB_OPENRGB_DEVICE=ASUS TUF GAMING B550-PLUS (WI-FI)
REACTIVE_RGB_NZXT_DEVICE=NZXT Smart Device V2
REACTIVE_RGB_STATIC_COLOR=FFFFFF
REACTIVE_RGB_OPENRGB_ZONE=1
REACTIVE_RGB_OPENRGB_ZONE_SIZE=60
# LEDs 1-12: CPU. LEDs 13-60: ventiladores internos (GPU).
REACTIVE_RGB_CPU_LED_COUNT=12
# CPU: azul <50, verde 50-69, naranja 70-84, rojo >=85.
REACTIVE_RGB_CPU_GREEN_THRESHOLD=50
REACTIVE_RGB_CPU_ORANGE_THRESHOLD=70
REACTIVE_RGB_CPU_RED_THRESHOLD=85
# GPU: azul <50, verde 50-69, naranja 70-82, rojo >=83.
REACTIVE_RGB_GPU_GREEN_THRESHOLD=50
REACTIVE_RGB_GPU_ORANGE_THRESHOLD=70
REACTIVE_RGB_GPU_RED_THRESHOLD=83
REACTIVE_RGB_INTERVAL=5
REACTIVE_RGB_DEBOUNCE=2
REACTIVE_RGB_HYSTERESIS=2
# Reaplica y verifica físicamente los destinos aunque la banda no cambie.
REACTIVE_RGB_REAPPLY_INTERVAL=300
