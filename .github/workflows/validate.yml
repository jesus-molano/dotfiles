name: Validate dotfiles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    runs-on: ubuntu-latest
    # packages.csv incluye paquetes nativos del repositorio CachyOS. La imagen
    # oficial evita falsos negativos; latest valida el catálogo rolling actual.
    container: cachyos/cachyos:latest
    timeout-minutes: 20
    steps:
      - name: Install Git for checkout
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: >-
          pacman -S --noconfirm --needed
          python stow just shellcheck fish zellij bat starship

      - name: Run as an unprivileged CachyOS user
        shell: bash
        run: |
          useradd --create-home --shell /bin/bash dotfiles-ci
          chown -R dotfiles-ci:dotfiles-ci "$GITHUB_WORKSPACE"
          runuser -u dotfiles-ci -- just --justfile "$GITHUB_WORKSPACE/justfile" ci
