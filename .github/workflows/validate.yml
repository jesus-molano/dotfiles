name: Validate dotfiles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_ai:
    name: Native Windows AI copies
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Portable sync contracts
        run: python -m unittest discover -s scripts/tests -p test_ai_sync.py
      - name: Project gate under cmd.exe
        run: python -m unittest discover -s scripts/tests -p test_project_gate.py
      - name: PowerShell deployment with spaces
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'AI User With Spaces'
          ./scripts/ai-setup.ps1 -Mode plan -TargetHome $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/ai-setup.ps1 -Mode apply -TargetHome $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/ai-setup.ps1 -Mode check -TargetHome $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  reproducible:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install Git for checkout
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: >-
          pacman -S --noconfirm --needed
          python stow just shellcheck fish zellij bat starship jq nodejs desktop-file-utils

      - name: Run as an unprivileged user
        shell: bash
        run: |
          useradd --create-home --shell /bin/bash dotfiles-ci
          chown -R dotfiles-ci:dotfiles-ci "$GITHUB_WORKSPACE"
          install -d -m 755 /run/systemd
          runuser -u dotfiles-ci -- just --justfile "$GITHUB_WORKSPACE/justfile" ci

  cachyos_packages:
    name: CachyOS package catalog
    runs-on: ubuntu-latest
    # latest es intencional: este job comprueba el catálogo rolling actual.
    container: cachyos/cachyos:latest
    timeout-minutes: 10
    steps:
      - name: Install Git for checkout
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate native package availability
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t native_packages < <(
            awk -F, '$4 == "native" { print $3 }' packages.csv | LC_ALL=C sort -u
          )
          ((${#native_packages[@]} > 0))
          pacman -Si "${native_packages[@]}" >/dev/null
          printf 'Validated %d native packages in CachyOS repositories.\n' "${#native_packages[@]}"
