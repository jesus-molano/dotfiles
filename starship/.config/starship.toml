palette = "noctalia"

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$python\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold mauve"

[git_status]
style = "bold maroon"

[nodejs]
symbol = " "
style = "bold green"

[rust]
symbol = " "
style = "bold peach"

[golang]
symbol = " "
style = "bold blue"

[python]
symbol = " "
style = "bold yellow"

[cmd_duration]
min_time = 2000
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

