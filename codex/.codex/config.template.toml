# Preferencias reproducibles. No sustituir config.toml: conserva hooks de
# integraciones (incluido Orca como respaldo) y datos específicos de la máquina.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
notify = ["codex-notify"]

[features]
hooks = true
memories = true

[memories]
disable_on_external_context = true

[sandbox_workspace_write]
network_access = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[tui]
theme = "project-atlas"
status_line = ["model-with-reasoning", "context-remaining", "used-tokens", "five-hour-limit", "weekly-limit", "git-branch"]
terminal_title = ["spinner", "project", "task-progress"]
notifications = ["agent-turn-complete", "approval-requested"]

# Project Atlas se genera con `just atlas-sync`: Node y el clon requieren rutas
# absolutas estables, por lo que no se deben copiar literalmente entre equipos.
# El bloque efectivo conserva esta forma y el perfil core de seis herramientas:
# [mcp_servers.component-atlas]
# command = "/ruta/absoluta/al/node-estable"
# args = ["/ruta/absoluta/project-atlas/packages/mcp/dist/index.js", "--profile", "core"]

# Integración personal opcional. OAuth no se versiona. El servidor habitual es
# técnicamente read-only; el de escritura permanece deshabilitado en la base.
# [mcp_servers.linear]
# url = "https://mcp.linear.app/mcp/readonly"
#
# [mcp_servers.linear-write]
# url = "https://mcp.linear.app/mcp"
# enabled = false
