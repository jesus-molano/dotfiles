# Reproducible preferences. Never replace config.toml: keep integration hooks
# and machine-specific data.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
notify = ["codex-notify"]

[features]
hooks = true
memories = true

[memories]
disable_on_external_context = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[tui]
theme = "project-atlas"
status_line = ["model-with-reasoning", "context-remaining", "used-tokens", "five-hour-limit", "weekly-limit", "git-branch"]
terminal_title = ["spinner", "project", "task-progress"]
notifications = ["agent-turn-complete", "approval-requested"]
