[accessibility]
ui_scale = 1.0

[audio]
enable_sounds = true
sound_volume = 0.65

[bar.default]
position = "top"
enabled = true
reserve_space = true
smart_auto_hide = false
margin_edge = 0
margin_ends = 6
thickness = 34
scale = 1.0
background_opacity = 0.92
concave_edge_corners = false
radius = 12
capsule = true
capsule_thickness = 0.72
capsule_radius = 9
capsule_fill = "surface_variant"
capsule_opacity = 0.82
capsule_padding = 6
padding = 8
widget_spacing = 4
start = [ "workspaces", "special_workspaces", "active_window" ]
center = [ "media" ]
end = [ "group:resources", "screen_recorder", "privacy", "tray", "notifications", "network", "bluetooth", "volume", "brightness", "power_profile", "battery", "timer", "clock" ]

[[bar.default.capsule_group]]
id = "resources"
members = [ "cpu", "cpu_temp", "gpu_usage", "gpu_temp", "ram" ]
fill = "surface_variant"
padding = 5.0
opacity = 0.82
enabled = true

[widget.gpu_usage]
type = "sysmon"
stat = "gpu_usage"

[widget.special_workspaces]
type = "jamesfeeder/special-workspaces:special-workspaces"
max_label_chars = 3
hide_inactive = false
capsule_radius = 8
capsule_padding = 4
capsule_min_width = 28
active_style = "fill"
inactive_style = "ghost"

[widget.screen_recorder]
type = "noctalia/screen_recorder:recorder"

[widget.timer]
type = "noctalia/timer:bar"
show_idle_on_horizontal = false

[shell]
font_family = "Inter"
avatar_path = "~/.local/share/noctalia/avatar.svg"
clipboard_enabled = true
clipboard_confirm_clear_history = true
clipboard_history_max_entries = 100
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
external_ip_enabled = false
telemetry_enabled = false

[shell.animation]
enabled = true
speed = 1.05

[shell.launcher.dmenu.entry.projects]
command = "desktop-launcher list projects"
label = "Projects"
prefix = "proj"
glyph = "folder-code"
global = false
exec = "desktop-launcher run projects \"{selection}\""

[shell.launcher.dmenu.entry.project_actions]
command = "desktop-launcher list project-actions"
label = "Project actions"
prefix = "proj-actions"
glyph = "tools"
global = false
exec = "desktop-launcher run project-actions \"{selection}\""

[shell.launcher.dmenu.entry.ssh]
command = "desktop-launcher list ssh"
label = "SSH"
prefix = "ssh"
glyph = "server"
global = false
exec = "desktop-launcher run ssh \"{selection}\""

[shell.launcher.dmenu.entry.media]
command = "desktop-launcher list media"
label = "Media"
prefix = "media"
glyph = "device-tv"
global = false
exec = "desktop-launcher run media \"{selection}\""

[shell.launcher.dmenu.entry.typing]
command = "desktop-launcher list typing"
label = "Typing"
prefix = "typing"
glyph = "keyboard"
global = false
exec = "desktop-launcher run typing \"{selection}\""

[shell.launcher.dmenu.entry.appearance]
command = "desktop-launcher list appearance"
label = "Appearance"
prefix = "appearance"
glyph = "palette"
global = false
exec = "desktop-launcher run appearance \"{selection}\""

[shell.launcher.dmenu.entry.keybindings]
command = "desktop-launcher list keybindings"
label = "Keybindings"
prefix = "keys"
glyph = "keyboard"
global = false
exec = "desktop-launcher run keybinding-categories \"{selection}\""

[shell.launcher.dmenu.entry.keybindings_windows]
command = "desktop-launcher list keybindings-windows"
label = "Windows and focus"
prefix = "keys-windows"
glyph = "keyboard"
global = false
exec = "true"

[shell.launcher.dmenu.entry.keybindings_workspaces]
command = "desktop-launcher list keybindings-workspaces"
label = "Workspaces"
prefix = "keys-workspaces"
glyph = "keyboard"
global = false
exec = "true"

[shell.launcher.dmenu.entry.keybindings_apps]
command = "desktop-launcher list keybindings-apps"
label = "Applications"
prefix = "keys-apps"
glyph = "keyboard"
global = false
exec = "true"

[shell.launcher.dmenu.entry.keybindings_media]
command = "desktop-launcher list keybindings-media"
label = "Media and capture"
prefix = "keys-media"
glyph = "keyboard"
global = false
exec = "true"

[shell.launcher.dmenu.entry.keybindings_system]
command = "desktop-launcher list keybindings-system"
label = "System and session"
prefix = "keys-system"
glyph = "keyboard"
global = false
exec = "true"

[shell.launcher.dmenu.entry.keybindings_all]
command = "desktop-launcher list keybindings-all"
label = "All keybindings"
prefix = "keys-all"
glyph = "keyboard"
global = false
exec = "true"

[shell.launcher.dmenu.entry.ports]
command = "desktop-launcher list ports"
label = "Development ports"
prefix = "ports"
glyph = "world-www"
global = false
exec = "desktop-launcher run ports \"{selection}\""

[shell.launcher.dmenu.entry.crashes]
command = "desktop-launcher list crashes"
label = "Recent crashes"
prefix = "crash"
glyph = "bug"
global = false
exec = "desktop-launcher run crashes \"{selection}\""

[shell.launcher.dmenu.entry.share]
command = "desktop-launcher list share"
label = "Share"
prefix = "share"
glyph = "share-2"
global = false
exec = "desktop-launcher run share \"{selection}\""

[shell.launcher.dmenu.entry.commands]
command = "desktop-launcher list commands"
label = "Commands"
prefix = "cmd"
glyph = "terminal-2"
global = false
exec = "desktop-launcher run commands \"{selection}\""

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"
transparency_mode = "soft"
borders = true

[shell.screenshot]
copy_to_clipboard = true
save_to_file = true
directory = "~/Pictures/Screenshots"
filename_pattern = "%Y-%m-%d_%H-%M-%S"
pipe_to_command = false
confirm_region = true
remember_last_region = true

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 3.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 3.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
enabled = true
shortcut = "5"
variant = "destructive"

[system.monitor]
gpu_poll_seconds = 3
cpu_poll_seconds = 3
memory_poll_seconds = 3

[brightness]
enable_ddcutil = true
ignore_mmids = []
minimum_brightness = 0.05
sync_all_monitors = false

[location]
address = ""
auto_locate = false
latitude = 28.4636296
longitude = -16.2518467
custom_schedule = true
sunrise = "07:30"
sunset = "20:30"

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 4000

[control_center]
hidden_tabs = []
show_shortcut_labels = true
sidebar = "compact"
sidebar_section = "compact"
width = 700

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "noctalia/screen_recorder:toggle"

[[control_center.shortcuts]]
type = "power_profile"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
action = "lock"
command = ""
enabled = true
resume_command = ""
timeout = 600.0

[idle.behavior.screen-off]
action = "screen_off"
command = ""
enabled = true
resume_command = ""
timeout = 660.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
command = ""
# Gate de seguridad: habilitar solo tras tres ciclos físicos correctos de
# suspensión/reanudación, incluyendo uno con monitor externo.
enabled = false
resume_command = ""
timeout = 1800.0

[weather]
enabled = true

[plugins]
auto_update = "none"
enabled = [ "noctalia/screen_recorder", "jamesfeeder/special-workspaces", "noctalia/timer", "noctalia/notes" ]

[plugin_settings."noctalia/notes"]
extension = "md"
notes_dir = "~/Documents/Notes"

[plugin_settings."noctalia/screen_recorder"]
audio_bitrate = 0
audio_codec = "opus"
audio_source = "default_output"
color_range = "limited"
copy_to_clipboard = false
directory = "~/Videos/Recordings"
filename_pattern = "recording_%Y%m%d_%H%M%S"
frame_rate = 60
hide_inactive = true
replay_duration = 90
replay_enabled = true
replay_filename_pattern = "replay_%Y%m%d_%H%M%S"
replay_storage = "ram"
resolution = "1920x1080"
restore_portal = true
show_cursor = true
video_codec = "h264"
video_qp = 25
video_source = "focused"

[wallpaper]
enabled = true
fill_mode = "crop"
fill_color = "surface"
directory = "~/.local/state/dotfiles/appearance-switch/visible"
transition = [ "fade" ]
transition_duration = 900

[wallpaper.default]
path = "~/.local/share/wallpapers/noctalia-themes/atlas/default.png"

[theme]
mode = "dark"
source = "custom"
custom_palette = "ProjectAtlas"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
# El template integrado de beta.8 fusiona la paleta en STARSHIP_CONFIG. Usamos
# uno completo para que su salida siempre sea un archivo generado, no el enlace
# de Stow de starship.toml.
builtin_ids = [ "btop", "ghostty", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[theme.templates.user.starship]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas-starship.toml"
output_path = "$XDG_CONFIG_HOME/noctalia/generated/starship.toml"

[theme.templates.user.bat]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas.tmTheme"
output_path = "$XDG_CONFIG_HOME/bat/themes/project-atlas.tmTheme"
post_hook = "bat cache --build"

[theme.templates.user.active_palette]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/active-palette.json"
output_path = "$XDG_CONFIG_HOME/noctalia/generated/active-palette.json"

[theme.templates.user.appearance_ready]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/appearance-ready.json"
output_path = "$XDG_STATE_HOME/dotfiles/appearance-switch/rendered-theme.json"
index = 10000
post_hook = "$HOME/.local/bin/appearance-switch template-ready"

[theme.templates.user.codex]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas.tmTheme"
output_path = "~/.codex/themes/project-atlas.tmTheme"
post_hook = "$HOME/.local/bin/project-atlas-theme-settings codex"

[theme.templates.user.micro]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas.micro"
output_path = "$XDG_CONFIG_HOME/micro/colorschemes/project-atlas.micro"
post_hook = "$HOME/.local/bin/project-atlas-theme-settings micro"

[theme.templates.user.vscode]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas-color-theme.json"
output_path = "~/.vscode/extensions/project-atlas-theme-1.0.0/themes/project-atlas-color-theme.json"

[theme.templates.user.vscodium]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas-color-theme.json"
output_path = "~/.vscode-oss/extensions/project-atlas-theme-1.0.0/themes/project-atlas-color-theme.json"

[theme.templates.user.zellij]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas-zellij.kdl"
output_path = "$XDG_CONFIG_HOME/zellij/themes/project-atlas.kdl"

[widget.launcher]
color = "primary"
capsule_fill = "primary"

[widget.workspaces]
style = "minimal"
label_source = "name"
show_labels = true
font_family = "FontAwesome"
max_label_chars = 1
labels_only_when_occupied = false
hide_when_empty = false
focused_color = "primary"
occupied_color = "on_surface"
empty_color = "on_surface_variant"
urgent_color = "error"
change_color_on_hover = false
capsule = false

[widget.active_window]
type = "active_window"
display = "text_only"
capsule = false
icon_size = 14.0
min_length = 40.0
max_length = 180.0
title_scroll = "on_hover"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.cpu_temp]
type = "sysmon"
stat = "cpu_temp"

[widget.ram]
type = "sysmon"
stat = "ram_pct"

[widget.gpu_temp]
type = "sysmon"
stat = "gpu_temp"

[widget.clock]
format = "{:%H:%M}"
color = "on_primary"
capsule_fill = "primary"
capsule_padding = 12

[widget.date]
type = "clock"
format = "{:%a %d %b}"

[widget.media]
anchor = true
hide_when_no_media = true
title_scroll = "on_hover"
max_length = 190
min_length = 60.0

[widget.privacy]
hide_inactive = true

[widget.network]
show_label = false
vpn_status = "both"

[widget.bluetooth]
show_label = false
hide_when_no_connected_device = true

[widget.volume]
show_label = false

[widget.brightness]
show_label = false

[widget.battery]
type = "battery"
device = "auto"
display_mode = "glyph"
show_label = true
label_content = "percent"

[widget.power_profile]
color = "tertiary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.tray]
capsule = false
drawer = false
hidden = []
