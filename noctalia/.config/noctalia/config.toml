[accessibility]
ui_scale = 1.0

[bar.default]
position = "top"
enabled = true
reserve_space = true
smart_auto_hide = false
margin_edge = 0
margin_ends = 6
thickness = 34
scale = 1.0
background_opacity = 0.92
concave_edge_corners = false
radius = 12
capsule = true
capsule_thickness = 0.72
capsule_radius = 9
capsule_fill = "surface_variant"
capsule_opacity = 0.82
capsule_padding = 6
padding = 8
widget_spacing = 4
start = [ "workspaces", "active_window" ]
center = [ "media" ]
end = [ "group:resources", "privacy", "tray", "notifications", "network", "bluetooth", "volume", "brightness", "power_profile", "battery", "clock" ]

[[bar.default.capsule_group]]
id = "resources"
members = [ "cpu", "ram" ]
fill = "surface_variant"
padding = 5.0
opacity = 0.82
enabled = true

[shell]
font_family = "Inter"
clipboard_enabled = true
clipboard_confirm_clear_history = true
clipboard_history_max_entries = 100
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
external_ip_enabled = false
telemetry_enabled = false

[shell.animation]
enabled = true
speed = 1.05

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"
transparency_mode = "soft"
borders = true

[shell.screenshot]
copy_to_clipboard = true
save_to_file = true
directory = "~/Pictures/Screenshots"
filename_pattern = "%Y-%m-%d_%H-%M-%S"
pipe_to_command = false
confirm_region = true
remember_last_region = true

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 3.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 3.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
enabled = true
shortcut = "5"
variant = "destructive"

[system.monitor]
gpu_poll_seconds = 0
cpu_poll_seconds = 3
memory_poll_seconds = 3

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
action = "lock"
command = ""
enabled = true
resume_command = ""
timeout = 600.0

[idle.behavior.screen-off]
action = "screen_off"
command = ""
enabled = true
resume_command = ""
timeout = 660.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
command = ""
# Gate de seguridad: habilitar solo tras tres ciclos físicos correctos de
# suspensión/reanudación, incluyendo uno con monitor externo.
enabled = false
resume_command = ""
timeout = 1800.0

[weather]
enabled = false

[plugins]
auto_update = false
enabled = []

[wallpaper]
enabled = true
fill_mode = "crop"
fill_color = "surface"
directory = "/home/jesus-molano/Pictures"
transition = [ "fade" ]
transition_duration = 900

[wallpaper.default]
path = "/home/jesus-molano/Pictures/wallhaven-2ero7g_2560x1440.png"

[theme]
mode = "dark"
source = "custom"
custom_palette = "ProjectAtlas"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = [ "btop", "ghostty", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt", "starship" ]

[theme.templates.user.bat]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas.tmTheme"
output_path = "$XDG_CONFIG_HOME/bat/themes/project-atlas.tmTheme"
post_hook = "bat cache --build"

[theme.templates.user.codex]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas.tmTheme"
output_path = "~/.codex/themes/project-atlas.tmTheme"
post_hook = "$HOME/.local/bin/project-atlas-theme-settings codex"

[theme.templates.user.micro]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas.micro"
output_path = "$XDG_CONFIG_HOME/micro/colorschemes/project-atlas.micro"
post_hook = "$HOME/.local/bin/project-atlas-theme-settings micro"

[theme.templates.user.vscode]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas-color-theme.json"
output_path = "~/.vscode/extensions/project-atlas-theme-1.0.0/themes/project-atlas-color-theme.json"

[theme.templates.user.vscodium]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas-color-theme.json"
output_path = "~/.vscode-oss/extensions/project-atlas-theme-1.0.0/themes/project-atlas-color-theme.json"

[theme.templates.user.zellij]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/project-atlas-zellij.kdl"
output_path = "$XDG_CONFIG_HOME/zellij/themes/project-atlas.kdl"

[widget.launcher]
color = "primary"
capsule_fill = "primary"

[widget.workspaces]
style = "minimal"
display = "name"
font_family = "FontAwesome"
max_label_chars = 1
labels_only_when_occupied = false
hide_when_empty = false
focused_color = "primary"
occupied_color = "on_surface"
empty_color = "on_surface_variant"
urgent_color = "error"
change_color_on_hover = false
capsule = false

[widget.active_window]
type = "active_window"
display = "text_only"
capsule = false
icon_size = 14.0
min_length = 40.0
max_length = 180.0
title_scroll = "on_hover"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.clock]
format = "{:%H:%M}"
color = "on_primary"
capsule_fill = "primary"
capsule_padding = 12

[widget.date]
type = "clock"
format = "{:%a %d %b}"

[widget.media]
anchor = true
hide_when_no_media = true
title_scroll = "on_hover"
max_length = 190
min_length = 60.0

[widget.privacy]
hide_inactive = true

[widget.network]
show_label = false
vpn_status = "both"

[widget.bluetooth]
show_label = false
hide_when_no_connected_device = true

[widget.volume]
show_label = false

[widget.brightness]
show_label = false

[widget.battery]
type = "battery"
device = "auto"
display_mode = "glyph"
show_label = true
label_content = "percent"

[widget.power_profile]
color = "tertiary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.tray]
capsule = false
drawer = false
hidden = []
