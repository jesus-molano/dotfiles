# Cable y wifi pueden estar a la vez en la misma subred. Con los valores por
# defecto, cada interfaz responde ARP por las IP de la otra, el router asocia
# la IP del cable a la MAC del wifi y el tráfico se pierde al apagar el wifi.
# arp_ignore=1: responde solo por las IP de la interfaz que recibe la petición.
# arp_announce=2: anuncia siempre la IP de la interfaz de salida.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
